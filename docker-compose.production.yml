services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakitapp-liaprofile
    ports:
      - "${APP_PORT:-13021}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: /app/data/lia-physics.db
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://host.docker.internal:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-lia-assets}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR:-/srv/data/rakitapp-liaprofile}/sqlite:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
